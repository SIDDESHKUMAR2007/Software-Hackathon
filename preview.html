<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Technova - Student Community Attendance Portal (Live Interactive Preview)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #020617;
      color: #f8fafc;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
    }
    .glass-input:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Icon helper component
    const Icon = ({ name, className = "w-4 h-4" }) => {
      const [el, setEl] = useState(null);
      useEffect(() => {
        if (window.lucide && window.lucide.icons[name]) {
          const svg = window.lucide.createLucideIcon(name);
        }
      }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    // Initial Mock Data
    const initialSettingsData = {
      attendanceWindowMins: 30,
      qrExpiryMins: 15,
      minPercentageForCert: 75.0,
      lateGracePeriodMins: 10,
      enableGeofence: false,
      autoExportWeeklyCSV: true,
      preventDuplicateScans: true,
      notifyAbsentees: true,
    };

    const initialRecordsData = [
      { id: "REC-1001", name: "Vivin Sharma", regNo: "24CS8042", department: "Computer Science", year: "3rd Year", community: "Web Development Guild", eventTitle: "Technova Hackathon 2026 - Keynote & Kickoff", checkIn: "09:34 AM", checkOut: "12:30 PM", status: "Present", markedBy: "QR Scanner" },
      { id: "REC-1002", name: "Aarav Mehta", regNo: "24IT4018", department: "Information Technology", year: "2nd Year", community: "AI & Machine Learning Society", eventTitle: "Technova Hackathon 2026 - Keynote & Kickoff", checkIn: "09:32 AM", checkOut: "12:30 PM", status: "Present", markedBy: "QR Scanner" },
      { id: "REC-1003", name: "Diya Roy", regNo: "24EC3089", department: "Electronics & Comm", year: "3rd Year", community: "Robotics & IoT Club", eventTitle: "Technova Hackathon 2026 - Keynote & Kickoff", checkIn: "09:41 AM", checkOut: "12:30 PM", status: "Late", markedBy: "QR Scanner" },
      { id: "REC-1004", name: "Kabir Sengupta", regNo: "24DS1056", department: "Data Science", year: "1st Year", community: "Cybersecurity & Hacking Lab", eventTitle: "Technova Hackathon 2026 - Keynote & Kickoff", checkIn: "-", checkOut: "-", status: "Absent", markedBy: "Prof. Rajesh Kumar" },
      { id: "REC-1005", name: "Neha Gupta", regNo: "24CS8201", department: "Computer Science", year: "4th Year", community: "UI/UX Design Studio", eventTitle: "Technova Hackathon 2026 - Keynote & Kickoff", checkIn: "09:30 AM", checkOut: "12:30 PM", status: "Present", markedBy: "QR Scanner" },
    ];

    const initialEventsData = [
      { id: "EVT-101", title: "Technova Hackathon 2026 - Keynote & Kickoff", community: "Web Development Guild", date: "2026-07-31", venue: "Main Auditorium", coordinator: "Prof. Rajesh Kumar", presentCount: 312, absentCount: 20, status: "Active" },
      { id: "EVT-102", title: "Deep Learning & Neural Nets Workshop", community: "AI & Machine Learning Society", date: "2026-07-30", venue: "CS Lab 3", coordinator: "Dr. Ananya Sharma", presentCount: 162, absentCount: 12, status: "Completed" },
    ];

    // Status Badge Component
    function StatusBadge({ status }) {
      const styles = {
        Present: "bg-emerald-500/10 text-emerald-400 border-emerald-500/30",
        Active: "bg-emerald-500/10 text-emerald-400 border-emerald-500/30",
        Absent: "bg-rose-500/10 text-rose-400 border-rose-500/30",
        Late: "bg-amber-500/10 text-amber-400 border-amber-500/30",
        Completed: "bg-slate-800 text-slate-400 border-slate-700",
      };
      return (
        <span className={`px-2.5 py-1 rounded-full text-[10px] font-extrabold uppercase border tracking-wider ${styles[status] || styles.Completed}`}>
          {status}
        </span>
      );
    }

    // Modal Component
    function SettingsModal({ isOpen, onClose, settings, onSaveSettings }) {
      const [formData, setFormData] = useState(settings);
      const [saved, setSaved] = useState(false);

      useEffect(() => {
        setFormData(settings);
      }, [settings]);

      if (!isOpen) return null;

      const handleSave = () => {
        onSaveSettings(formData);
        setSaved(true);
        setTimeout(() => {
          setSaved(false);
          onClose();
        }, 1000);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
          <div className="w-full max-w-xl glass-panel border border-slate-700/60 rounded-3xl shadow-2xl p-6 space-y-6">
            <div className="flex items-center justify-between pb-4 border-b border-slate-800">
              <h3 className="text-lg font-bold text-white tracking-wide">⚙️ System Settings & Policy Control</h3>
              <button onClick={onClose} className="p-1 text-slate-400 hover:text-white">✕</button>
            </div>

            <div className="space-y-4">
              <div className="p-4 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-2">
                <div className="flex justify-between text-xs font-bold">
                  <span className="text-slate-200">Attendance Window Duration</span>
                  <span className="text-purple-400">{formData.attendanceWindowMins} mins</span>
                </div>
                <input
                  type="range" min="5" max="120" step="5"
                  value={formData.attendanceWindowMins}
                  onChange={(e) => setFormData({ ...formData, attendanceWindowMins: parseInt(e.target.value) })}
                  className="w-full accent-purple-500 bg-slate-800 h-2 rounded-lg cursor-pointer"
                />
              </div>

              <div className="p-4 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-2">
                <div className="flex justify-between text-xs font-bold">
                  <span className="text-slate-200">Dynamic QR Expiry</span>
                  <span className="text-indigo-400">{formData.qrExpiryMins} mins</span>
                </div>
                <input
                  type="range" min="1" max="60" step="1"
                  value={formData.qrExpiryMins}
                  onChange={(e) => setFormData({ ...formData, qrExpiryMins: parseInt(e.target.value) })}
                  className="w-full accent-indigo-500 bg-slate-800 h-2 rounded-lg cursor-pointer"
                />
              </div>

              <div className="p-4 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-2">
                <div className="flex justify-between text-xs font-bold">
                  <span className="text-slate-200">Min Attendance % for Certificate</span>
                  <span className="text-emerald-400">{formData.minPercentageForCert}%</span>
                </div>
                <input
                  type="range" min="50" max="100" step="5"
                  value={formData.minPercentageForCert}
                  onChange={(e) => setFormData({ ...formData, minPercentageForCert: parseFloat(e.target.value) })}
                  className="w-full accent-emerald-500 bg-slate-800 h-2 rounded-lg cursor-pointer"
                />
              </div>

              <div className="p-4 rounded-2xl bg-slate-900/60 border border-slate-800 flex items-center justify-between">
                <div>
                  <p className="text-xs font-bold text-white">Campus Geofencing Validation</p>
                  <p className="text-[11px] text-slate-400">Restrict QR scanning to campus GPS coordinates</p>
                </div>
                <input
                  type="checkbox"
                  checked={formData.enableGeofence}
                  onChange={(e) => setFormData({ ...formData, enableGeofence: e.target.checked })}
                  className="w-5 h-5 accent-indigo-600 rounded cursor-pointer"
                />
              </div>
            </div>

            <div className="flex items-center justify-end space-x-3 border-t border-slate-800 pt-4">
              <button onClick={onClose} className="px-4 py-2 rounded-xl text-slate-400 text-xs font-bold">Cancel</button>
              <button
                onClick={handleSave}
                className={`px-5 py-2.5 rounded-xl font-bold text-xs shadow-lg transition-all ${
                  saved ? 'bg-emerald-600 text-white' : 'bg-gradient-to-r from-purple-600 to-indigo-600 text-white'
                }`}
              >
                {saved ? '✓ Saved Changes!' : 'Save System Rules'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      const [role, setRole] = useState('admin');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [settings, setSettings] = useState(initialSettingsData);
      const [records, setRecords] = useState(initialRecordsData);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [search, setSearch] = useState('');

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createLucideIcons();
        }
      });

      const filteredRecords = records.filter(r => 
        r.name.toLowerCase().includes(search.toLowerCase()) || 
        r.regNo.toLowerCase().includes(search.toLowerCase())
      );

      return (
        <div className="min-h-screen flex flex-col">
          
          {/* Header */}
          <header className="sticky top-0 z-30 glass-panel border-b border-slate-800 px-6 py-3.5 flex items-center justify-between">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center font-bold text-white shadow-lg">
                ⚡
              </div>
              <div>
                <h1 className="text-base font-extrabold text-white tracking-tight">Technova</h1>
                <p className="text-[10px] text-slate-400">Student Community Attendance Portal</p>
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 p-1 rounded-xl flex items-center space-x-1">
              <span className="text-xs text-slate-400 px-2 font-medium">Role:</span>
              <button onClick={() => setRole('admin')} className={`px-3 py-1 rounded-lg text-xs font-bold ${role === 'admin' ? 'bg-purple-600 text-white' : 'text-slate-400'}`}>Admin</button>
              <button onClick={() => setRole('coordinator')} className={`px-3 py-1 rounded-lg text-xs font-bold ${role === 'coordinator' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}>Coordinator</button>
              <button onClick={() => setRole('student')} className={`px-3 py-1 rounded-lg text-xs font-bold ${role === 'student' ? 'bg-cyan-600 text-white' : 'text-slate-400'}`}>Student</button>
            </div>
          </header>

          <div className="flex flex-1">
            {/* Sidebar Navigation */}
            <aside className="w-64 glass-panel border-r border-slate-800 p-4 space-y-2 hidden md:block">
              <button onClick={() => setActiveTab('dashboard')} className={`w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                📊 Admin Dashboard
              </button>
              <button onClick={() => setActiveTab('records')} className={`w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 ${activeTab === 'records' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:bg-slate-800'}`}>
                📋 Attendance Roster
              </button>
              <button onClick={() => setIsModalOpen(true)} className="w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold text-purple-400 hover:bg-slate-800 flex items-center gap-2 border border-purple-500/20 mt-4">
                ⚙️ System Settings Modal
              </button>
            </aside>

            {/* Main Area */}
            <main className="flex-1 p-6 space-y-6 max-w-6xl mx-auto w-full">
              
              {activeTab === 'dashboard' && (
                <div className="space-y-6">
                  <div className="flex items-center justify-between">
                    <div>
                      <h2 className="text-2xl font-extrabold text-white">Admin Master Dashboard</h2>
                      <p className="text-xs text-slate-400 mt-1">Real-time attendance analytics & system rules control</p>
                    </div>
                    <button
                      onClick={() => setIsModalOpen(true)}
                      className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-bold text-xs shadow-lg shadow-purple-600/30 flex items-center gap-2"
                    >
                      ⚙️ Configure Attendance Rules
                    </button>
                  </div>

                  {/* 6 Metric Cards */}
                  <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
                    <div className="glass-card p-4 rounded-2xl">
                      <p className="text-[10px] font-bold text-slate-400 uppercase">Total Students</p>
                      <h3 className="text-xl font-extrabold text-white mt-1">1,475</h3>
                    </div>
                    <div className="glass-card p-4 rounded-2xl border-emerald-500/30">
                      <p className="text-[10px] font-bold text-emerald-400 uppercase">Present Today</p>
                      <h3 className="text-xl font-extrabold text-emerald-400 mt-1">312</h3>
                    </div>
                    <div className="glass-card p-4 rounded-2xl border-rose-500/30">
                      <p className="text-[10px] font-bold text-rose-400 uppercase">Absent Today</p>
                      <h3 className="text-xl font-extrabold text-rose-400 mt-1">20</h3>
                    </div>
                    <div className="glass-card p-4 rounded-2xl border-amber-500/30">
                      <p className="text-[10px] font-bold text-amber-400 uppercase">Late Students</p>
                      <h3 className="text-xl font-extrabold text-amber-400 mt-1">8</h3>
                    </div>
                    <div className="glass-card p-4 rounded-2xl border-indigo-500/30">
                      <p className="text-[10px] font-bold text-indigo-400 uppercase">Active Sessions</p>
                      <h3 className="text-xl font-extrabold text-indigo-400 mt-1">3</h3>
                    </div>
                    <div className="glass-card p-4 rounded-2xl border-cyan-500/30">
                      <p className="text-[10px] font-bold text-cyan-400 uppercase">Attendance Rate</p>
                      <h3 className="text-xl font-extrabold text-cyan-400 mt-1">92.8%</h3>
                    </div>
                  </div>

                  {/* Active Rules Card */}
                  <div className="glass-card p-5 rounded-2xl border-purple-500/30 space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="text-sm font-bold text-white">🛡️ Active Attendance System Policies</h3>
                      <button onClick={() => setIsModalOpen(true)} className="text-xs font-bold text-purple-400 hover:underline">Edit Rules</button>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 text-xs">
                      <div className="p-3 rounded-xl bg-slate-900/80 border border-slate-800">
                        <span className="text-slate-400 block">Attendance Window:</span>
                        <strong className="text-white text-base">{settings.attendanceWindowMins} Minutes</strong>
                      </div>
                      <div className="p-3 rounded-xl bg-slate-900/80 border border-slate-800">
                        <span className="text-slate-400 block">Dynamic QR Expiry:</span>
                        <strong className="text-indigo-400 text-base">{settings.qrExpiryMins} Minutes</strong>
                      </div>
                      <div className="p-3 rounded-xl bg-slate-900/80 border border-slate-800">
                        <span className="text-slate-400 block">Min % for Certificate:</span>
                        <strong className="text-emerald-400 text-base">{settings.minPercentageForCert}% Minimum</strong>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {activeTab === 'records' && (
                <div className="space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-xl font-extrabold text-white">Attendance Roster</h2>
                    <input
                      type="text"
                      placeholder="Search student or reg no..."
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                      className="glass-input rounded-xl px-3 py-1.5 text-xs w-64"
                    />
                  </div>

                  <div className="glass-panel rounded-2xl overflow-hidden border border-slate-800">
                    <table className="w-full text-left text-xs text-slate-300">
                      <thead className="bg-slate-900 text-slate-400 uppercase font-bold text-[10px]">
                        <tr>
                          <th className="p-3">Student Name</th>
                          <th className="p-3">Register No</th>
                          <th className="p-3">Department</th>
                          <th className="p-3">Check In</th>
                          <th className="p-3">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {filteredRecords.map((r) => (
                          <tr key={r.id} className="hover:bg-slate-800/40">
                            <td className="p-3 font-bold text-white">{r.name}</td>
                            <td className="p-3 font-mono text-indigo-400">{r.regNo}</td>
                            <td className="p-3">{r.department}</td>
                            <td className="p-3 font-mono">{r.checkIn}</td>
                            <td className="p-3"><StatusBadge status={r.status} /></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

            </main>
          </div>

          <SettingsModal
            isOpen={isModalOpen}
            onClose={() => setIsModalOpen(false)}
            settings={settings}
            onSaveSettings={(newSet) => setSettings(newSet)}
          />

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
